[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnist-showcase"
version = "1.0.0"
description = "MNIST digit classification project showcasing ML and software engineering expertise"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Juan Esteban Betancur", email = "juaneshwa963@gmail.com"}
]
keywords = ["mnist", "neural-networks", "tensorflow", "pytorch", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "tensorflow>=2.13.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "mlflow>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "flake8>=6.0.0",
    "pylint>=2.17.0",
    "black>=23.7.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tensorflow", "pytorch"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.pylint]
max-line-length = 100
disable = [
    "C0111",  # Missing docstring
    "R0903",  # Too few public methods
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=. --cov-report=html"
