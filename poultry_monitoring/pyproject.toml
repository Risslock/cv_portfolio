[project]
name = "poultry-monitoring"
version = "0.1.0"
description = "YOLO26 vs. DETR detection & instance segmentation on ChickenVerse, plus DALI loading and ONNX/LiteRT export benchmarking."
requires-python = ">=3.11"
dependencies = [
    # Pinned versions TBD at Phase 0 (see plan.md) once training actually starts —
    # placeholders here establish the dependency set and CUDA-index wiring.
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",     # swap to the yolo26-specific release once pinned
    "transformers>=4.44",
    "mlflow>=2.16",
    "pycocotools>=2.0.7",
    "albumentations>=1.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "torchinfo>=1.8",
]

# CUDA wheels on the local native-Windows env (constitution Principle IX). If this is
# ever synced on a non-Windows box, the marker won't match and `uv sync` falls back to
# plain PyPI (CPU wheels) instead of erroring — fine for gates/smoke-tests, not for training.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poultry_monitoring"]
