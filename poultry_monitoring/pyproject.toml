[project]
name = "poultry-monitoring"
version = "0.1.0"
description = "YOLO26 detection & instance segmentation on ChickenVerse, with synthetic copy-paste augmentation and ONNX/OpenVINO/TensorRT export + quantization benchmarking."
requires-python = ">=3.11"
dependencies = [
    # Pinned versions TBD at Phase 0 (see plan.md) once training actually starts —
    # placeholders here establish the dependency set and CUDA-index wiring.
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3", # swap to the yolo26-specific release once pinned
    "transformers>=4.44",
    "mlflow>=2.16",
    "pycocotools>=2.0.7",
    "albumentations>=1.4",
    "optuna>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "torchinfo>=1.8",
]

# Phase 6 export/quantization backends. Declared here rather than left to Ultralytics'
# AutoUpdate, which pip-installs missing backends at export time and would put them
# outside uv.lock (constitution Principle VII).
#
# `onnxruntime-gpu` only -- deliberately NOT alongside `onnxruntime`. Both publish the
# same `onnxruntime` module, so installing both leaves whichever landed last in place;
# the GPU build ships the CPU execution provider too, so it covers both devices.
export = [
    "onnx>=1.22",
    # Upper-bounded at <1.23 deliberately: 1.23+ links against CUDA 13 (`cublasLt64_13.dll`),
    # while torch here is cu124. The CUDA-12 builds resolve against the CUDA 12 + cuDNN 9
    # DLLs torch already ships, so this pin needs no extra multi-GB runtime wheels. Raising
    # it means either a cu13 torch or installing CUDA 13 runtime libs alongside.
    "onnxruntime-gpu>=1.22,<1.23",  # CUDA + CPU execution providers, and .quantization
    "onnxslim>=0.1.96",  # graph simplification; Ultralytics calls it for onnx/INT8 exports
    "openvino>=2026.3",
    "nncf>=3.3",  # OpenVINO post-training INT8 quantization
    # Upper-bounded at <11 deliberately: TensorRT 11 dropped `BuilderFlag.FP16`/`INT8`/
    # `OBEY_PRECISION_CONSTRAINTS` for strongly-typed networks, and ultralytics 8.4.117's
    # `utils/export/engine.py` still sets all three -- engine export raises AttributeError
    # on TRT 11. Revisit when Ultralytics supports the strongly-typed builder API.
    "tensorrt>=10.7,<11",
]

# CUDA wheels on the local native-Windows env (constitution Principle IX). If this is
# ever synced on a non-Windows box, the marker won't match and `uv sync` falls back to
# plain PyPI (CPU wheels) instead of erroring — fine for gates/smoke-tests, not for training.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]
# D100/D104: don't require a module/package docstring on every file — only enforcing
# docstring *content* (Google convention) where a docstring is already expected.
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
# Test classes/methods are self-documenting via their names (test_noop_when_already_zero
# reads as a spec) — a docstring on every one would be pure noise, not signal.
"tests/**" = ["D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poultry_monitoring"]
